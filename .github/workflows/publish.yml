name: Publish to npm (Trusted Publishing)

on:
  workflow_dispatch:
  push:
    tags:
      - auth-browser-v*
      - auth-server-v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The version to publish lives only in the git tag (auth-{browser,server}-vX.Y.Z);
      # package.json may still carry the previous version. Bump it before publish so
      # `npm publish` ships the version that matches the tag (AAR-179 postmortem).
      - name: Resolve published version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_OUTPUT"

      - name: Bump @aardwin/auth-browser version to match tag
        if: startsWith(github.ref_name, 'auth-browser-v')
        working-directory: browser-sdk
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Bump @aardwin/auth-server version to match tag
        if: startsWith(github.ref_name, 'auth-server-v')
        working-directory: server-sdk
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish @aardwin/auth-browser
        working-directory: browser-sdk
        if: startsWith(github.ref_name, 'auth-browser-v')
        run: |
          bun install --frozen-lockfile
          npm publish --provenance --access public

      - name: Publish @aardwin/auth-server
        working-directory: server-sdk
        if: startsWith(github.ref_name, 'auth-server-v')
        run: |
          bun install --frozen-lockfile
          npm publish --provenance --access public
